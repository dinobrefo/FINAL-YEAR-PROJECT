version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ierbms_db
    environment:
      POSTGRES_USER: ierbms_user
      POSTGRES_PASSWORD: ierbms_password
      POSTGRES_DB: ierbms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
