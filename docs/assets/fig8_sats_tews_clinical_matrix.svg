<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111F"/>
      <stop offset="50%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#0B2032"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1100" height="660" fill="url(#bgGrad)"/>

  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="10" height="34" fill="#EF4444" rx="3"/>
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="1">SOUTH AFRICAN TRIAGE SCALE (SATS) / TEWS MATRIX</text>
    <text x="24" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Ghana Health Service Clinical Standard Implementation for Paramedic &amp; ER Triage Handover</text>
  </g>

  <g transform="translate(60, 110)">
    
    <!-- RED -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="980" height="88" rx="12" fill="#111C2D" stroke="#EF4444" stroke-width="1.5"/>
      <rect width="160" height="88" rx="12" fill="#EF4444"/>
      <text x="22" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">RED PRIORITY</text>
      <text x="22" y="58" fill="#FEE2E2" font-family="monospace" font-size="12" font-weight="700">IMMEDIATE / RESUS</text>
      <text x="22" y="74" fill="#FCA5A5" font-family="sans-serif" font-size="10">Target: 0 mins</text>

      <g transform="translate(180, 24)" font-family="sans-serif" fill="#F8FAFC">
        <text y="0" font-size="13" font-weight="bold">Clinical Criteria: TEWS Score ≥ 7  OR  Physiological Emergency Discriminator</text>
        <text y="22" font-size="11.5" fill="#94A3B8">• Cardiac arrest, severe respiratory distress (SpO₂ &lt; 85%), status epilepticus, unresponsiveness (AVPU: P or U)</text>
        <text y="42" font-size="11.5" fill="#FCA5A5" font-weight="bold">IERBMS Rule: Triggers immediate audible alarm + automated ICU / Trauma Bay provisional reservation lock</text>
      </g>
    </g>

    <!-- ORANGE -->
    <g transform="translate(0, 104)" filter="url(#shadow)">
      <rect width="980" height="88" rx="12" fill="#111C2D" stroke="#F97316" stroke-width="1.5"/>
      <rect width="160" height="88" rx="12" fill="#F97316"/>
      <text x="22" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">ORANGE PRIORITY</text>
      <text x="22" y="58" fill="#FFEDD5" font-family="monospace" font-size="12" font-weight="700">VERY URGENT</text>
      <text x="22" y="74" fill="#FED7AA" font-family="sans-serif" font-size="10">Target: &lt; 10 mins</text>

      <g transform="translate(180, 24)" font-family="sans-serif" fill="#F8FAFC">
        <text y="0" font-size="13" font-weight="bold">Clinical Criteria: TEWS Score 5 – 6  OR  Major Specific Condition</text>
        <text y="22" font-size="11.5" fill="#94A3B8">• Open fractures, acute chest pain (suspected STEMI), severe bleeding, altered mental status (AVPU: V)</text>
        <text y="42" font-size="11.5" fill="#FDBA74" font-weight="bold">IERBMS Rule: Automatically prioritized over all non-immediate admissions; assigns acute resuscitation bed</text>
      </g>
    </g>

    <!-- YELLOW -->
    <g transform="translate(0, 208)" filter="url(#shadow)">
      <rect width="980" height="88" rx="12" fill="#111C2D" stroke="#EAB308" stroke-width="1.5"/>
      <rect width="160" height="88" rx="12" fill="#EAB308"/>
      <text x="22" y="38" fill="#000000" font-family="sans-serif" font-size="16" font-weight="900">YELLOW PRIORITY</text>
      <text x="22" y="58" fill="#713F12" font-family="monospace" font-size="12" font-weight="700">URGENT</text>
      <text x="22" y="74" fill="#854D0E" font-family="sans-serif" font-size="10">Target: &lt; 60 mins</text>

      <g transform="translate(180, 24)" font-family="sans-serif" fill="#F8FAFC">
        <text y="0" font-size="13" font-weight="bold">Clinical Criteria: TEWS Score 3 – 4  OR  Moderate Trauma</text>
        <text y="22" font-size="11.5" fill="#94A3B8">• Closed long bone fractures, moderate asthma without hypoxia, persistent abdominal pain with stable vitals</text>
        <text y="42" font-size="11.5" fill="#FDE047" font-weight="bold">IERBMS Rule: Routes to nearest facility with general bed availability; monitors for clinical deterioration</text>
      </g>
    </g>

    <!-- GREEN -->
    <g transform="translate(0, 312)" filter="url(#shadow)">
      <rect width="980" height="88" rx="12" fill="#111C2D" stroke="#22C55E" stroke-width="1.5"/>
      <rect width="160" height="88" rx="12" fill="#22C55E"/>
      <text x="22" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">GREEN PRIORITY</text>
      <text x="22" y="58" fill="#DCFCE7" font-family="monospace" font-size="12" font-weight="700">NON-URGENT</text>
      <text x="22" y="74" fill="#BBF7D0" font-family="sans-serif" font-size="10">Target: &lt; 240 mins</text>

      <g transform="translate(180, 24)" font-family="sans-serif" fill="#F8FAFC">
        <text y="0" font-size="13" font-weight="bold">Clinical Criteria: TEWS Score 0 – 2  OR  Minor Injury / Illness</text>
        <text y="22" font-size="11.5" fill="#94A3B8">• Minor lacerations, sprains, mild dehydration, normal vital signs, alert &amp; fully mobile</text>
        <text y="42" font-size="11.5" fill="#86EFAC" font-weight="bold">IERBMS Rule: Routes to primary health centres or polyclinics to prevent tertiary hospital saturation</text>
      </g>
    </g>

    <!-- BLUE -->
    <g transform="translate(0, 416)" filter="url(#shadow)">
      <rect width="980" height="88" rx="12" fill="#111C2D" stroke="#3B82F6" stroke-width="1.5"/>
      <rect width="160" height="88" rx="12" fill="#3B82F6"/>
      <text x="22" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="900">BLUE PRIORITY</text>
      <text x="22" y="58" fill="#DBEAFE" font-family="monospace" font-size="12" font-weight="700">DECEASED / EXPECT</text>
      <text x="22" y="74" fill="#BFDBFE" font-family="sans-serif" font-size="10">Palliative / Mortuary</text>

      <g transform="translate(180, 24)" font-family="sans-serif" fill="#F8FAFC">
        <text y="0" font-size="13" font-weight="bold">Clinical Criteria: Catastrophic Fatal Injuries or Unresponsive Without Vital Signs</text>
        <text y="22" font-size="11.5" fill="#94A3B8">• Certified death at scene, injuries incompatible with life; requires coroner / mortuary logistics</text>
        <text y="42" font-size="11.5" fill="#93C5FD" font-weight="bold">IERBMS Rule: Dedicated coroner log; leaves clinical resuscitation beds unaffected</text>
      </g>
    </g>

  </g>

  <text x="60" y="635" fill="#64748B" font-family="sans-serif" font-size="11">Standard Clinical Triage Implementation • Compliant with Ghana Ministry of Health &amp; Ghana Health Service Protocols</text>
</svg>