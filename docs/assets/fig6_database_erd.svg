<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06111F"/>
      <stop offset="50%" stop-color="#081827"/>
      <stop offset="100%" stop-color="#0D2033"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="10" height="34" fill="#3B82F6" rx="3"/>
    <text x="24" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="1">RELATIONAL ENTITY-RELATIONSHIP SCHEMA (POSTGRESQL)</text>
    <text x="24" y="44" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Atomic Bed Allocations, Geospatial Coordinates &amp; Audit Traceability</text>
  </g>

  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="320" height="290" rx="12" fill="#111C2D" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="320" height="36" rx="12" fill="#1D4ED8"/>
    <text x="16" y="23" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">TABLE: HOSPITALS</text>
    <g transform="translate(16, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#F59E0B" font-weight="bold">PK </tspan>id : uuid</text>
      <text y="24">name : varchar(255)</text>
      <text y="48">latitude : double precision</text>
      <text y="72">longitude : double precision</text>
      <text y="96">total_general_beds : int4</text>
      <text y="120"><tspan fill="#10B981">occupied_general_beds : int4</tspan></text>
      <text y="144">total_icu_beds : int4</text>
      <text y="168"><tspan fill="#EF4444" font-weight="bold">occupied_icu_beds : int4</tspan></text>
      <text y="192">region : varchar(100)</text>
      <text y="216">phone : varchar(50)</text>
    </g>
  </g>

  <g transform="translate(440, 110)" filter="url(#shadow)">
    <rect width="320" height="290" rx="12" fill="#111C2D" stroke="#8B5CF6" stroke-width="1.5"/>
    <rect width="320" height="36" rx="12" fill="#6D28D9"/>
    <text x="16" y="23" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">TABLE: USERS (RBAC)</text>
    <g transform="translate(16, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#F59E0B" font-weight="bold">PK </tspan>id : uuid</text>
      <text y="24">email : varchar(255) [UNIQUE]</text>
      <text y="48">password_hash : varchar(255)</text>
      <text y="72"><tspan fill="#8B5CF6" font-weight="bold">role : enum</tspan> (paramedic, doc, nurse, admin)</text>
      <text y="96">full_name : varchar(255)</text>
      <text y="120">phone : varchar(50)</text>
      <text y="144">approval_status : varchar(50)</text>
      <text y="168"><tspan fill="#3B82F6">FK </tspan>hospital_id : uuid</text>
      <text y="192">created_at : timestamp</text>
    </g>
  </g>

  <g transform="translate(820, 110)" filter="url(#shadow)">
    <rect width="320" height="180" rx="12" fill="#111C2D" stroke="#10B981" stroke-width="1.5"/>
    <rect width="320" height="36" rx="12" fill="#047857"/>
    <text x="16" y="23" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">TABLE: HOSPITAL_EQUIPMENT</text>
    <g transform="translate(16, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#F59E0B" font-weight="bold">PK </tspan>id : uuid</text>
      <text y="24"><tspan fill="#3B82F6">FK </tspan>hospital_id : uuid</text>
      <text y="48">equipment_type : varchar(100)</text>
      <text y="72">is_available : boolean</text>
      <text y="96">updated_at : timestamp</text>
    </g>
  </g>

  <g transform="translate(60, 440)" filter="url(#shadow)">
    <rect width="320" height="270" rx="12" fill="#111C2D" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="320" height="36" rx="12" fill="#B91C1C"/>
    <text x="16" y="23" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">TABLE: AMBULANCES</text>
    <g transform="translate(16, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#F59E0B" font-weight="bold">PK </tspan>id : uuid</text>
      <text y="24">call_sign : varchar(50)</text>
      <text y="48">plate_number : varchar(50)</text>
      <text y="72"><tspan fill="#EF4444" font-weight="bold">status : enum</tspan> (avail, en-route, arrived)</text>
      <text y="96">current_latitude : double</text>
      <text y="120">current_longitude : double</text>
      <text y="144">speed : float4</text>
      <text y="168">heading : int4 (0-360 deg)</text>
      <text y="192">last_ping : timestamp</text>
    </g>
  </g>

  <g transform="translate(440, 440)" filter="url(#shadow)">
    <rect width="700" height="270" rx="12" fill="#111C2D" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="700" height="36" rx="12" fill="#B45309"/>
    <text x="16" y="23" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="700">TABLE: EMERGENCY_CASES (CLINICAL TRIAGE &amp; TELEMETRY BRIDGE)</text>
    
    <g transform="translate(16, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0"><tspan fill="#F59E0B" font-weight="bold">PK </tspan>id : uuid</text>
      <text y="24"><tspan fill="#EF4444">FK </tspan>ambulance_id : uuid</text>
      <text y="48"><tspan fill="#3B82F6">FK </tspan>assigned_hospital_id : uuid</text>
      <text y="72">patient_identifier : varchar(100) [TOKENIZED]</text>
      <text y="96">trauma_level : int4 (SATS TEWS 0-10)</text>
      <text y="120">emergency_type : varchar(100)</text>
      <text y="144">bed_type_assigned : varchar(50) (icu, general, trauma)</text>
      <text y="168"><tspan fill="#F59E0B" font-weight="bold">status : enum</tspan> (active, in-transit, arrived, resolved)</text>
      <text y="192"><tspan fill="#10B981">patient_vitals : jsonb</tspan> { HR, BP, SpO2, Temp, RR, AVPU }</text>
    </g>

    <g transform="translate(380, 54)" font-family="monospace" font-size="11.5" fill="#E2E8F0">
      <text y="0">triage_notes : text</text>
      <text y="24">ai_recommended_hospital_id : uuid</text>
      <text y="48">ai_estimated_duration_mins : float4</text>
      <text y="72">created_at : timestamp</text>
      <text y="96">handover_timestamp : timestamp</text>
      <text y="120">resolved_at : timestamp</text>
    </g>
  </g>

  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.6">
    <path d="M 220 400 L 220 425 L 500 425 L 500 440"/>
    <path d="M 380 560 L 440 560"/>
    <path d="M 440 250 L 380 250"/>
    <path d="M 380 200 L 410 200 L 410 80 L 980 80 L 980 110"/>
  </g>

  <g font-family="sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC">
    <rect x="225" y="405" width="28" height="16" rx="4" fill="#3B82F6"/>
    <text x="233" y="417">1:N</text>

    <rect x="395" y="545" width="28" height="16" rx="4" fill="#EF4444"/>
    <text x="403" y="557">1:N</text>
  </g>

  <text x="60" y="750" fill="#64748B" font-family="sans-serif" font-size="11">IERBMS Schema Specification • Implemented in PostgreSQL + PostGIS with ACID Row-Level Concurrency Locks</text>
</svg>